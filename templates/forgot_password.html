<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CoreFix Technologies</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

          <!-- CoreFix PWA -->
<link
    rel="manifest"
    href="{{ url_for('static', filename='pwa/manifest.json') }}"
>

<meta name="theme-color" content="#080b10">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoreFix">

<link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='assets/corefix-icon-192.png') }}"
>
</head>



<body class="auth-body">

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-brand">

            <a href="{{ url_for('home') }}" class="auth-logo">

                <span class="auth-logo-icon">
                    <i class="fa-solid fa-key"></i>
                </span>

                <span>
                    CoreFix
                    <small>Account Recovery</small>
                </span>

            </a>

        </div>


        <div class="auth-heading">

            <h1>Forgot Password?</h1>

            <p>
                Enter the email address connected to your
                CoreFix account to request a password reset.
            </p>

        </div>


        {% if message %}

        <div class="profile-success">

            <i class="fa-solid fa-circle-check"></i>

            <span>{{ message }}</span>

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('forgot_password') }}"
            class="auth-form"
        >

            <div class="auth-field">

                <label for="email">
                    Email Address
                </label>

                <div class="auth-input-wrapper">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >

                <i class="fa-solid fa-paper-plane"></i>

                Send Reset Link

            </button>

        </form>


        <div class="auth-home-link">

            <a href="{{ url_for('login') }}">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Sign In

            </a>

        </div>

    </section>

</main>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register(
                "{{ url_for('static', filename='pwa/service-worker.js') }}"
            );
        });
    }
</script>

</body>
</html>
