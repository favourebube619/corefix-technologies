<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Change Password | CoreFix Technologies
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CoreFix PWA -->
<link
    rel="manifest"
    href="{{ url_for('static', filename='pwa/manifest.json') }}"
>

<meta name="theme-color" content="#080b10">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoreFix">

<link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='assets/corefix-icon-192.png') }}"
>

</head>



<body class="auth-body">

    <main class="auth-page">

        <section class="auth-card">

            <!-- BRAND -->

            <div class="auth-brand">

                <a
                    href="{{ url_for('customer_dashboard') }}"
                    class="auth-logo"
                >

                    <span class="auth-logo-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>

                    <span>
                        CoreFix
                        <small>Account Security</small>
                    </span>

                </a>

            </div>


            <!-- HEADING -->

            <div class="auth-heading">

                <h1>Change Password</h1>

                <p>
                    Enter your current password and choose
                    a new password for your CoreFix account.
                </p>

            </div>


            <!-- ERROR -->

            {% if error %}

                <div class="auth-alert">

                    <i class="fa-solid fa-circle-exclamation"></i>

                    <span>{{ error }}</span>

                </div>

            {% endif %}


            <!-- SUCCESS -->

            {% if success %}

                <div class="profile-success">

                    <i class="fa-solid fa-circle-check"></i>

                    <span>{{ success }}</span>

                </div>

            {% endif %}


            <!-- FORM -->

            <form
                method="POST"
                action="{{ url_for('change_password') }}"
                class="auth-form"
            >

                <!-- CURRENT PASSWORD -->

                <div class="auth-field">

                    <label for="current_password">
                        Current Password
                    </label>

                    <div class="auth-input-wrapper password-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="current_password"
                            name="current_password"
                            placeholder="Enter current password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="current_password"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- NEW PASSWORD -->

                <div class="auth-field">

                    <label for="new_password">
                        New Password
                    </label>

                    <div class="auth-input-wrapper password-wrapper">

                        <i class="fa-solid fa-key"></i>

                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            placeholder="Minimum 8 characters"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="new_password"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <div class="auth-input-wrapper password-wrapper">

                        <i class="fa-solid fa-key"></i>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Enter new password again"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm_password"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="auth-submit"
                >

                    <i class="fa-solid fa-shield-halved"></i>

                    Change Password

                </button>

            </form>


            <!-- BACK -->

            <div class="auth-home-link">

                <a href="{{ url_for('customer_dashboard') }}">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Dashboard

                </a>

            </div>

        </section>

    </main>


    <!-- PASSWORD SHOW / HIDE -->

    <script>

        document
            .querySelectorAll(".password-toggle")
            .forEach(button => {

                button.addEventListener("click", () => {

                    const target =
                        document.getElementById(
                            button.dataset.target
                        );

                    const icon =
                        button.querySelector("i");

                    if (target.type === "password") {

                        target.type = "text";

                        icon.classList.remove("fa-eye");
                        icon.classList.add("fa-eye-slash");

                        button.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        target.type = "password";

                        icon.classList.remove("fa-eye-slash");
                        icon.classList.add("fa-eye");

                        button.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                    }

                });

            });

    </script>

    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register(
                "/service-worker.js",
                { scope: "/" }
            );
        });
    }
</script>

</body>
</html>
