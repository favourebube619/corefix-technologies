<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | CoreFix Technologies</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CoreFix PWA -->
<link
    rel="manifest"
    href="{{ url_for('static', filename='pwa/manifest.json') }}"
>

<meta name="theme-color" content="#080b10">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoreFix">

<link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='assets/corefix-icon-192.png') }}"
>

</head>


<body class="auth-body">

    <main class="auth-page">

        <section class="auth-card">

            <!-- BRAND -->
            <div class="auth-brand">

                <a href="{{ url_for('home') }}" class="auth-logo">

                    <span class="auth-logo-icon">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                    </span>

                    <span>
                        CoreFix
                        <small>Technologies</small>
                    </span>

                </a>

            </div>


            <!-- HEADING -->
            <div class="auth-heading">

                <h1>Welcome back</h1>

                <p>
                    Sign in to your CoreFix account to manage
                    your repairs, orders and account activity.
                </p>

            </div>


            <!-- ERROR MESSAGE -->
            {% if error %}

                <div class="auth-alert">

                    <i class="fa-solid fa-circle-exclamation"></i>

                    <span>{{ error }}</span>

                </div>

            {% endif %}


            <!-- LOGIN FORM -->
            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="auth-form"
            >

                <!-- EMAIL -->
                <div class="auth-field">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="auth-input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            value="{{ request.form.get('email', '') }}"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
<div class="auth-field">

    <label for="password">
        Password
    </label>

    <div class="auth-input-wrapper password-wrapper">

        <i class="fa-solid fa-lock"></i>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            class="password-toggle"
            data-target="password"
            aria-label="Show password"
        >
            <i class="fa-regular fa-eye"></i>
        </button>

    </div>

</div>


<!-- FORGOT PASSWORD -->
<div class="forgot-password-row">

    <a href="{{ url_for('forgot_password') }}">
        Forgot password?
    </a>

</div>


<!-- SIGN IN BUTTON -->
<button
    type="submit"
    class="auth-submit"
>
    Sign In
    <i class="fa-solid fa-arrow-right"></i>
</button>

            </form>


            <!-- SIGN UP LINK -->
            <div class="auth-footer">

                <p>
                    Don't have an account?

                    <a href="{{ url_for('signup') }}">
                        Create account
                    </a>
                </p>

            </div>


            <!-- HOME -->
            <div class="auth-home-link">

                <a href="{{ url_for('home') }}">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to CoreFix

                </a>

            </div>

        </section>

    </main>


    <!-- PASSWORD VISIBILITY -->
    <script>

        document
            .querySelectorAll(".password-toggle")
            .forEach(button => {

                button.addEventListener("click", () => {

                    const targetId = button.dataset.target;
                    const input =
                        document.getElementById(targetId);

                    const icon =
                        button.querySelector("i");

                    if (input.type === "password") {

                        input.type = "text";

                        icon.classList.remove("fa-eye");
                        icon.classList.add("fa-eye-slash");

                        button.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        input.type = "password";

                        icon.classList.remove("fa-eye-slash");
                        icon.classList.add("fa-eye");

                        button.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                    }

                });

            });

    </script>

    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register(
                "/service-worker.js",
                { scope: "/" }
            );
        });
    }
</script>

</body>
</html>
