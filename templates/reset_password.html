<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CoreFix Technologies</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

          <!-- CoreFix PWA -->
<link
    rel="manifest"
    href="{{ url_for('static', filename='pwa/manifest.json') }}"
>

<meta name="theme-color" content="#080b10">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoreFix">

<link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='assets/corefix-icon-192.png') }}"
>
</head>



<body class="auth-body">

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-brand">

            <a href="{{ url_for('home') }}" class="auth-logo">

                <span class="auth-logo-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </span>

                <span>
                    CoreFix
                    <small>Password Recovery</small>
                </span>

            </a>

        </div>


        <div class="auth-heading">

            <h1>Reset Password</h1>

            {% if not invalid_token %}

            <p>
                Create a new secure password for your
                CoreFix account.
            </p>

            {% endif %}

        </div>


        {% if error %}

        <div class="auth-alert">

            <i class="fa-solid fa-circle-exclamation"></i>

            <span>{{ error }}</span>

        </div>

        {% endif %}


        {% if not invalid_token %}

        <form method="POST" class="auth-form">

            <div class="auth-field">

                <label for="new_password">
                    New Password
                </label>

                <div class="auth-input-wrapper password-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Minimum 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="new_password"
                        aria-label="Show password"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>

                </div>

            </div>


            <div class="auth-field">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div class="auth-input-wrapper password-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Enter password again"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirm_password"
                        aria-label="Show password"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>

                </div>

            </div>


            <button type="submit" class="auth-submit">

                <i class="fa-solid fa-key"></i>

                Reset Password

            </button>

        </form>

        {% else %}

        <a
            href="{{ url_for('forgot_password') }}"
            class="auth-submit"
        >
            <i class="fa-solid fa-rotate-right"></i>
            Request New Link
        </a>

        {% endif %}


        <div class="auth-home-link">

            <a href="{{ url_for('login') }}">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Sign In

            </a>

        </div>

    </section>

</main>


<script>

document
    .querySelectorAll(".password-toggle")
    .forEach(button => {

        button.addEventListener("click", () => {

            const input =
                document.getElementById(
                    button.dataset.target
                );

            const icon =
                button.querySelector("i");

            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

            }

        });

    });

</script>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register(
                "/service-worker.js",
                { scope: "/" }
            );
        });
    }
</script>

</body>
</html>
